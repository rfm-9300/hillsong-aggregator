services:
  caddy:
    image: caddy:2.10-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web_proxy

volumes:
  caddy_data:
  caddy_config:

networks:
  web_proxy:
    external: true
