[project]
name = "sermon-cut"
version = "0.1.0"
description = "Extract the main sermon from a full church-service video"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
  "python-dotenv>=1.0.0",
  "google-genai>=1.0.0",
  "anthropic>=0.40.0",
  "yt-dlp>=2024.8.6",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
]

[project.scripts]
extract-sermon = "sermon_cut.cli:main"
