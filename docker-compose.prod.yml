services:
  web:
    image: ghcr.io/rfm-9300/hillsong-aggregator:${TAG:-latest}
    env_file:
      - path: .env
        format: raw
    environment:
      DATA_DIR: /data
    volumes:
      - extractor_data:/data
    restart: always
    networks:
      - default
      - web_proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: ghcr.io/rfm-9300/hillsong-aggregator:${TAG:-latest}
    command: python -m app.worker
    env_file:
      - path: .env
        format: raw
    environment:
      DATA_DIR: /data
    volumes:
      - extractor_data:/data
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  extractor_data:

networks:
  web_proxy:
    external: true
